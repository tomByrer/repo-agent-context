[project]
name = "repo-agent-context"
version = "0.1.0"
description = "Build local issue and pull request context for coding agents."
readme = "README.md"
authors = [
    { name = "Arno Waschk", email = "arno@arnow.solutions" }
]
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0"
]

[project.scripts]
repo-agent-context = "repo_agent_context.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "coverage>=7.14.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
source = ["src/repo_agent_context"]

[tool.coverage.report]
fail_under = 100
show_missing = true
