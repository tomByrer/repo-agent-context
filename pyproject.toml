[project]
name = "repo-agent-context"
version = "0.1.0"
description = "Build local issue and pull request context for coding agents."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Arno Waschk", email = "arno@arnow.solutions" }
]
requires-python = ">=3.10"
keywords = [
  "coding-agents",
  "github",
  "llm",
  "local-llm",
  "maintainers",
  "repository-context",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0"
]

[project.urls]
Homepage = "https://github.com/arnowaschk/repo-agent-context"
Repository = "https://github.com/arnowaschk/repo-agent-context"
Issues = "https://github.com/arnowaschk/repo-agent-context/issues"

[project.scripts]
repo-agent-context = "repo_agent_context.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "coverage>=7.14.0",
  "tox>=4.0.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
source = ["src/repo_agent_context"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.tox]
requires = ["tox>=4.0"]
env_list = ["py310", "py311", "py312", "py313", "py314", "lint", "type"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
description = "Run tests with coverage"
package = "editable"
deps = [
  "coverage>=7.14.0",
  "pytest>=8.0.0",
]
commands = [
  ["coverage", "run", "-m", "pytest", "-q"],
  ["coverage", "report"],
]

[tool.tox.env.lint]
description = "Run ruff"
deps = ["ruff>=0.6.0"]
commands = [["ruff", "check", "."]]

[tool.tox.env.type]
description = "Run mypy"
deps = [
  "mypy>=1.10.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
]
commands = [["mypy", "src"]]
